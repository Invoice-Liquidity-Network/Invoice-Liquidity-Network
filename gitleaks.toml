title = "Invoice Liquidity Network gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|/)\.secrets\.baseline$''',
  '''(^|/)gitleaks\.toml$''',
  '''cli/src/dev-environment\.ts$''',
  '''cli/src/dev-seed\.ts$''',
  '''cli/tests/dev-seed\.test\.ts$''',
  '''indexer/tests/dashboard\.security\.test\.ts$''',
  '''packages/sdk/src/clients/InvoiceClient\.test\.ts$''',
  '''docs/sdk-next-migration\.md$''',
  '''docs/mainnet-deployment-dry-run\.md$''',
  '''docs/indexer/backup-archive\.md$'''
]

[[rules]]
id = "stellar-secret-seed"
description = "Detect committed Stellar secret seeds beginning with an 'S'."
regex = '''\bS[A-Z2-7]{55}\b'''
tags = ["stellar", "secret", "seed"]
entropy = 3.5

[[rules]]
id = "ethereum-private-key"
description = "Detect Ethereum private keys in hex format."
regex = '''\b(?:0x)?[a-f0-9]{64}\b'''
tags = ["ethereum", "private-key"]
entropy = 3.5

[[rules]]
id = "aws-credential"
description = "Detect AWS credentials such as access key IDs used by AWS SDKs."
regex = '''\b(?:A3T[A-Z0-9]{16}|AKIA[A-Z0-9]{16}|ASIA[A-Z0-9]{16}|ABIA[A-Z0-9]{16}|ACCA[A-Z0-9]{16})\b'''
tags = ["aws", "credential"]
entropy = 3

[[rules]]
id = "generic-api-token"
description = "Detect generic API tokens or bearer tokens that look like secrets."
regex = '''(?i)\b(?:api[_-]?key|api[_-]?token|secret[_-]?key|private[_-]?key|bearer[_-]?token|access[_-]?token)\b\s*[=:]\s*['\"]?[A-Za-z0-9\-_]{20,120}['\"]?'''
tags = ["api", "token", "secret"]
entropy = 3

# ── Issue #1081: additional rules to close secrets-baseline gaps ──────────

[[rules]]
id = "redis-url"
description = "Detect Redis connection URLs that may contain credentials."
regex = '''(?:rediss?://)[^\s'"]{10,200}'''
tags = ["redis", "credential", "url"]
entropy = 3
# `[[rules.allowlists]]` with a `regexes` array, not the retired
# `[rules.allowlist]` + `regex` table: gitleaks >=8.18 rejects an allowlist
# that carries none of commits/paths/regexes/stopwords, and the singular
# `regex` key is not one of them — the whole config then fails to load.
[[rules.allowlists]]
description = "Allow the example Redis URLs used in the docs and compose stack: localhost, the `redis` service name, `your-*` placeholders and example.org-style domains, with or without a placeholder password. The host must be followed by a terminator, so real hosts (`redis.prod.internal`) and look-alikes (`localhost.evil.com`) still report; not `$`-anchored because the greedy rule regex glues trailing punctuation onto the match."
regexes = [
  '''^rediss?://(?:[^@\s/]*@)?(?:localhost|127\.0\.0\.1|redis|your-[\w-]+|(?:[\w-]+\.)?example\.(?:com|org|net))(?:[^.\w]|$)'''
]

[[rules]]
id = "database-url"
description = "Detect database connection URLs (PostgreSQL, MySQL) that may contain credentials."
regex = '''(?:postgres(?:ql)?|mysql|mariadb)://[^\s'"]{10,200}'''
tags = ["database", "credential", "url"]
entropy = 3
[[rules.allowlists]]
description = "Allow example/test database URLs"
regexes = ['''(?:localhost|127\.0\.0\.1|example\.com)''']

[[rules]]
id = "private-key-pem"
description = "Detect PEM-encoded private keys."
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["private-key", "pem"]

[[rules]]
id = "jwt-token"
description = "Detect JSON Web Tokens (JWTs) with realistic payload structure."
regex = '''eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]{20,}'''
tags = ["jwt", "token", "secret"]
entropy = 3
