[build]
builder = "nixpacks"
buildCommand = "corepack pnpm install --frozen-lockfile --filter iln-indexer... && corepack pnpm --filter iln-indexer build"

[deploy]
startCommand = "corepack pnpm --filter iln-indexer start"
# Single-instance only — SQLite single-writer constraint prevents horizontal scaling.
numReplicas = 1
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
# A process that exits on invalid configuration must not restart forever.
restartPolicyMaxRetries = 3

[variables]
NODE_ENV = "production"
PORT = "3001"
# SQLite always runs in WAL mode (indexer/src/db.ts); no variable controls it.
