name: Indexer Backup

on:
  schedule:
    # Run nightly at 02:00 UTC — off-peak hours for Stellar testnet.
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger for on-demand backups.

permissions:
  contents: read

jobs:
  backup:
    name: Database backup and archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build indexer
        working-directory: indexer
        run: pnpm run build

      - name: Run database backup
        working-directory: indexer
        run: node dist/backup.js
        env:
          BACKUP_ENABLED: "true"
          BACKUP_DIR: /tmp/iln-backups
          BACKUP_INTERVAL_MS: "86400000"
          BACKUP_MAX_LOCAL: "7"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexer-backup-${{ github.run_id }}
          path: /tmp/iln-backups
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            core.warning(`Indexer backup job failed. See ${runUrl}`);
