name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Least-privilege: the PR title is read from the event payload; only read access
# to the checkout is needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --frozen-lockfile --ignore-scripts
      - name: Lint PR title
        env:
          # Pass the title through the environment rather than interpolating it
          # into the shell: a title containing quotes or `$(...)` would
          # otherwise be executed as part of this run.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > pr_title
          pnpm exec commitlint --config commitlint.config.js --edit pr_title
