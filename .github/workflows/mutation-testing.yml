name: Mutation Testing

on:
  schedule:
    # Run weekly: Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Allow manual trigger from the Actions tab
  pull_request:
    paths:
      - 'packages/sdk/src/errors.ts'
      - 'packages/sdk/src/errors.test.ts'
      - 'packages/sdk/stryker.config.mjs'
      - 'packages/sdk/package.json'
      - 'indexer/src/**'
      - 'indexer/tests/**'
      - 'oracle-service/src/**'

# Mutation testing is intentionally non-blocking for PRs:
# - It can take 5-30 minutes per target module
# - Results are advisory: they reveal test-quality gaps without blocking merge
# - Full runs happen weekly via the scheduled trigger
# - PRs touching mutation targets get a smoke run for awareness
permissions:
  contents: read
  pull-requests: write

# Prevent concurrent runs of the same workflow on the same ref
concurrency:
  group: mutation-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-errors-mutation:
    name: 📊 SDK errors.ts mutation score
    runs-on: ubuntu-latest
    # Always continue even if the mutation score is below threshold
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Install Stryker dependencies
        working-directory: ./packages/sdk
        run: pnpm install --no-frozen-lockfile 2>/dev/null || pnpm install

      - name: Run Stryker mutation tests on errors.ts
        working-directory: ./packages/sdk
        run: pnpm test:mutation
        continue-on-error: true
        timeout-minutes: 10

      - name: Upload mutation report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-sdk-errors
          path: packages/sdk/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

      - name: Post mutation score summary to PR
        if: github.event_name == 'pull_request' && (success() || failure())
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = 'packages/sdk/reports/mutation/index.html';
            let scoreMsg = '⚠️ Mutation testing report was not generated (see workflow logs).';
            if (fs.existsSync(reportPath)) {
              scoreMsg = `🧬 Mutation testing completed for \`packages/sdk/src/errors.ts\`. ` +
                `Download the **mutation-report-sdk-errors** artifact from the workflow run for the full HTML report.`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧬 Mutation Testing Summary\n\n${scoreMsg}\n\n*Scheduled full runs happen weekly on Sunday at 06:00 UTC.*`
            })

  # ── Issue #1085: Indexer event-processing mutation testing ──────────────
  indexer-mutation:
    name: 🧬 Indexer critical-path mutation score
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --no-frozen-lockfile 2>/dev/null || pnpm install

      - name: Install Stryker
        working-directory: ./indexer
        run: pnpm add -D @stryker-mutator/core @stryker-mutator/vitest-runner 2>/dev/null || true

      - name: Run Stryker on indexer event-processing
        working-directory: ./indexer
        run: |
          npx stryker run \
            --mutate 'src/processor.ts' \
            --testRunner vitest \
            --testRunnerNodeArgs '--import tsx' \
            --coverageAnalysis perTest \
            --reporters ['html','clear-text'] \
            --htmlReporter.fileName 'reports/mutation/index.html' \
            --timeoutMS 30000
        continue-on-error: true
        timeout-minutes: 15

      - name: Upload indexer mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-indexer
          path: indexer/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # ── Issue #1085: Oracle-service aggregation mutation testing ────────────
  oracle-mutation:
    name: 🧬 Oracle-service composition mutation score
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Install oracle-service dependencies
        working-directory: ./oracle-service
        run: pnpm install --no-frozen-lockfile 2>/dev/null || pnpm install

      - name: Install Stryker
        working-directory: ./oracle-service
        run: pnpm add -D @stryker-mutator/core @stryker-mutator/vitest-runner 2>/dev/null || true

      - name: Run Stryker on oracle composition logic
        working-directory: ./oracle-service
        run: |
          npx stryker run \
            --mutate 'src/composition.ts,src/verifier.ts' \
            --testRunner vitest \
            --testRunnerNodeArgs '--import tsx' \
            --coverageAnalysis perTest \
            --reporters ['html','clear-text'] \
            --htmlReporter.fileName 'reports/mutation/index.html' \
            --timeoutMS 30000
        continue-on-error: true
        timeout-minutes: 15

      - name: Upload oracle mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-oracle
          path: oracle-service/reports/mutation/
          retention-days: 30
          if-no-files-found: warn
