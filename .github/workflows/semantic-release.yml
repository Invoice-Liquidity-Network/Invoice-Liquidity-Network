# ==============================================================================
# Semantic Release — automated versioning and GitHub Releases
#
# Runs AFTER all CI checks pass on main. Reads conventional commits to:
#   - Determine the next version (major/minor/patch)
#   - Generate / update CHANGELOG.md
#   - Create a GitHub Release with generated notes
#   - Commit the CHANGELOG.md and package.json version bump back to main
#
# Package-level versioning (packages/sdk, sdk) is still handled by Changesets.
# This workflow owns only the root monorepo version and the GitHub Release.
# ==============================================================================

name: Semantic Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run when CI succeeded; skip for Changesets version-bump commits
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL are set automatically by
          # semantic-release when the token is provided.
