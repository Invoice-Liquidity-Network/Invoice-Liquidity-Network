# ==============================================================================
# Changeset Check — Issue #247 (audited for #958 — package-consolidation coverage)
#
# Enforces that every PR touching package source files includes a changeset.
# This ensures changelog entries and semver bumps are never missed.
#
# Runs on: PRs touching any publishable workspace package:
#          packages/**  — shared, sdk-next, react, indexer, etc. (pnpm-workspace packages/*)
#          sdk/**       — canonical SDK  (@iln/sdk)
#          cli/**       — canonical CLI  (@invoice-liquidity/cli) — newly-canonical
#                        post-consolidation (packages/cli removed, see
#                        docs/monorepo-map.md Resolution Plans 2026-08-25)
# Skips:   PRs that only touch docs, tests, CI config, private packages, or
#          non-published service workspaces (e.g. indexer/, notifications/ with
#          private:true, docs/ legacy source, examples/, private test helpers)
# ==============================================================================

name: Changeset Check

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'sdk/**'
      - 'cli/**'

# Least-privilege: read code and post the "changeset required" comment on PRs.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Require changeset for package changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Check for changeset
        run: |
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/main...HEAD)

          # Check if any publishable package source files changed.
          # Must stay in sync with `on.pull_request.paths` above and
          # pnpm-workspace.yaml workspaces. Covers:
          #   packages/** — all shared libs (shared, sdk-next, react, etc.)
          #   sdk/**      — canonical SDK  (@iln/sdk)
          #   cli/**      — canonical CLI  (@invoice-liquidity/cli), the
          #                 post-consolidation canonical package previously at
          #                 packages/cli (removed 2026-08-25).
          PKG_CHANGED=$(echo "$CHANGED" | grep -E '^(packages|sdk|cli)/' || true)

          if [ -z "$PKG_CHANGED" ]; then
            echo "No package source files changed — changeset not required."
            exit 0
          fi

          # Check if a changeset file was added
          CHANGESET=$(echo "$CHANGED" | grep -E '^\.changeset/.+\.md$' || true)

          if [ -z "$CHANGESET" ]; then
            echo ""
            echo "❌ Package source files were changed but no changeset was found."
            echo ""
            echo "Please add a changeset by running:"
            echo "  pnpm changeset"
            echo ""
            echo "Changed package files:"
            echo "$PKG_CHANGED"
            exit 1
          fi

          echo "✅ Changeset found: $CHANGESET"

      - name: Flag dependents of changed packages
        # Advisory only — never fails the build. Runs even if the changeset
        # requirement above failed, since that's exactly when knowing which
        # downstream packages might also need one is most useful.
        # packages/shared (and other widely-depended-on internal packages)
        # can affect several downstream workspaces; this surfaces them as an
        # explicit reviewer checklist item instead of relying on someone
        # remembering the dependency graph. See CONTRIBUTING.md#changeset-workflow.
        if: always()
        continue-on-error: true
        run: node scripts/check-changeset-dependents.mjs

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Changeset required!** This PR changes package source files but does not include a changeset.\n\nPlease run `pnpm changeset` locally, follow the prompts, and commit the generated `.changeset/*.md` file.\n\nSee [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#changeset-workflow) for details.'
            })
