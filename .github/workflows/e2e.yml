name: E2E Integration

on:
  push:
    branches: [main, dev]
    paths:
      - 'tests/e2e/**'
      - 'sdk/**'
      - 'packages/**'
      - '.github/workflows/e2e.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'tests/e2e/**'
      - 'sdk/**'
      - 'packages/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Start Local Stellar Node
        run: docker compose -f tests/e2e/docker-compose.yml up -d stellar-quickstart

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Wait for Stellar RPC
        run: |
          echo "Waiting for Stellar node to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}' > /dev/null 2>&1; then
              echo "Stellar node RPC is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Stellar node failed to start within timeout"
          docker compose -f tests/e2e/docker-compose.yml logs
          exit 1

      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          CONTRACT_ID: ${{ env.CONTRACT_ID || 'C_DEPLOYED_CONTRACT_ID' }}

      - name: Check test output for skip regression
        if: startsWith(github.ref, 'refs/heads/release') || contains(github.event.pull_request.labels.*.name, 'release')
        run: |
          output=$(pnpm test:e2e 2>&1 || true)
          skip_count=$(echo "$output" | grep -o "[0-9]* skipped" | head -1 | grep -o "[0-9]*" || echo "0")
          echo "Tests skipped: $skip_count"
          if [ "$skip_count" -gt 5 ]; then
            echo "ERROR: Too many tests skipped on release branch ($skip_count > 5). This indicates incomplete E2E coverage."
            exit 1
          fi
