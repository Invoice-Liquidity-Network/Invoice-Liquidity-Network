name: Snyk Security Scanning

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 3 * * 0' # Weekly scan at 3 AM on Sunday

# Least-privilege: read code to run the Snyk vulnerability scan.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    name: Snyk Vulnerability Scanner
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Skip Snyk when token is unavailable
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is not available for this run; skipping Snyk scan."

      - name: Setup Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        run: |
          # --all-projects auto-discovers every package.json in the
          # workspace (oracle-service, indexer, notifications, sdk,
          # cli, packages/*, examples/*, etc.).  Scan the root last
          # so it covers any top-level devDependencies.
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --prune-repeated-transitive-deps
