name: Docs Link Check

# Checks internal and external links across both documentation trees (docs/
# and packages/docs/content) so a broken Markdown link surfaces in CI instead
# of going unnoticed the way a broken code import never would.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/docs/content/**'
      - '*.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/__tests__/check-doc-links.test.mjs'
      - 'package.json'
      - '.github/markdown-link-check.json'
      - '.github/workflows/docs-link-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/docs/content/**'
      - '*.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/__tests__/check-doc-links.test.mjs'
      - 'package.json'
      - '.github/markdown-link-check.json'
      - '.github/workflows/docs-link-check.yml'
  schedule:
    # Catch external link rot (moved or removed third-party pages) even on
    # weeks with no doc changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege: only reads repo content to check links.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test documentation link-check guard
        run: node --test scripts/__tests__/check-doc-links.test.mjs

      - name: Check all documentation links and assert coverage
        run: |
          set -euo pipefail
          check_scope() {
            local label="$1"
            local expected="$2"
            shift 2
            local output checked
            output=$(node scripts/check-doc-links.mjs "$@")
            printf '%s\n' "$output"
            checked=$(printf '%s\n' "$output" | sed -n 's/^Checked \([0-9][0-9]*\) files,.*/\1/p')
            if [ "$checked" != "$expected" ]; then
              echo "Coverage mismatch for $label: checker scanned ${checked:-none}, expected $expected" >&2
              exit 2
            fi
            echo "| $label | $checked | passed |" >> "$GITHUB_STEP_SUMMARY"
          }

          docs_count=$(find docs -type f -name '*.md' | wc -l | tr -d ' ')
          content_count=$(find packages/docs/content -type f -name '*.mdx' | wc -l | tr -d ' ')
          root_count=0
          for file in README.md CONTRIBUTING.md SECURITY.md DEPLOYMENT_GUIDE.md CHANGELOG.md; do
            if [ -f "$file" ]; then root_count=$((root_count + 1)); fi
          done

          echo '### Documentation link check' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner: Docs lead. Recovery: inspect the failed path or HTTP status, repair the destination, and rerun this workflow. Network-unavailable external links are reported as warnings by the checker.' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Files checked | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---|' >> "$GITHUB_STEP_SUMMARY"
          check_scope 'docs/' "$docs_count" 'docs/**/*.md'
          check_scope 'packages/docs/content/' "$content_count" 'packages/docs/content/**/*.mdx'
          check_scope 'root Markdown' "$root_count" README.md CONTRIBUTING.md SECURITY.md DEPLOYMENT_GUIDE.md CHANGELOG.md
