name: Docs Link Check

# Checks internal and external links across both documentation trees (docs/
# and packages/docs/content) so a broken Markdown link surfaces in CI instead
# of going unnoticed the way a broken code import never would.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/docs/content/**'
      - '*.md'
      - '.github/markdown-link-check.json'
      - '.github/workflows/docs-link-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/docs/content/**'
      - '*.md'
      - '.github/markdown-link-check.json'
  schedule:
    # Catch external link rot (moved or removed third-party pages) even on
    # weeks with no doc changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege: only reads repo content to check links.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in docs/
        run: |
          node scripts/check-doc-links.mjs 'docs/**/*.md'

      - name: Check links in packages/docs/content/
        run: |
          node scripts/check-doc-links.mjs 'packages/docs/content/**/*.mdx'

      - name: Check links in root markdown files
        run: |
          node scripts/check-doc-links.mjs README.md CONTRIBUTING.md SECURITY.md DEPLOYMENT_GUIDE.md CHANGELOG.md

      - name: Assert expected doc coverage
        run: |
          # Fail if the number of files checked drops unexpectedly.
          # We expect at least 200 docs files (adjust if repository grows).
          COUNT=$(node -e "console.log(require('glob').sync('docs/**/*.md').length + require('glob').sync('packages/docs/content/**/*.mdx').length + ['README.md','CONTRIBUTING.md','SECURITY.md','DEPLOYMENT_GUIDE.md','CHANGELOG.md'].filter(f=>require('fs').existsSync(f)).length)")
          echo "Docs files checked: $COUNT"
          if [ "$COUNT" -lt 200 ]; then
            echo "Unexpected drop in docs coverage: $COUNT < 200" >&2
            exit 2
          fi
