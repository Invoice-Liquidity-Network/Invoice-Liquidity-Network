name: Indexer migration schema

on:
  pull_request:
    paths:
      - 'indexer/src/db.ts'
      - 'indexer/tests/migrations.test.ts'
      - 'scripts/migrations/**'
      - '.github/workflows/indexer-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'indexer/src/db.ts'
      - 'indexer/tests/migrations.test.ts'
      - 'scripts/migrations/**'

jobs:
  migration-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install only what the isolated schema test imports. The root workspace
      # lockfile currently contains unrelated unpublished workspace packages.
      - name: Install migration test dependencies
        working-directory: indexer
        run: |
          npm pkg delete 'devDependencies.@iln/eslint-config'
          npm install --no-save --package-lock=false vitest@4.1.5 better-sqlite3@11 dotenv@16
      - name: Verify fresh database schema
        working-directory: indexer
        run: npx vitest run tests/migrations.test.ts
