# Reusable workflow: restore/save the pnpm store with lockfile-scoped cache keys.
# Run as an early job; caller jobs should use ./.github/actions/setup-pnpm with the same inputs.
#
# Contract
# ─────────────────────────────────────────────────────────────────────────────
# Inputs (all optional — safe defaults for this repo):
#   node-version       string   Node.js version               (default: 20)
#   pnpm-version       string   pnpm version                  (default: 9.0.0)
#   lockfile-path      string   pnpm-lock.yaml path           (default: pnpm-lock.yaml)
#   cache-key-prefix   string   Prefix for actions/cache keys  (default: iln)
#   install-dependencies  bool  Run pnpm install after cache? (default: false)
#   install-args       string   Args for pnpm install          (default: --frozen-lockfile)
#
# Outputs:
#   cache-hit  string  "true" when a full cache key matched, "false" otherwise
#
# Side effects:
#   - Populates the GitHub Actions cache with the pnpm virtual store
#   - Optionally runs pnpm install (when install-dependencies = true)
#
# Consumers: ci.yml, cli-docs.yml, coverage.yml, deploy.yml,
#            indexer-migrations.yml, knip.yml, sdk-api-docs.yml,
#            sdk-bundle-size.yml, sdk-e2e-local-node.yml
# ─────────────────────────────────────────────────────────────────────────────
name: Reusable pnpm cache

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for setup-node
        required: false
        type: string
        default: '20'
      pnpm-version:
        description: pnpm version for pnpm/action-setup
        required: false
        type: string
        default: '9.0.0'
      lockfile-path:
        description: Path to pnpm-lock.yaml (relative to repository root)
        required: false
        type: string
        default: pnpm-lock.yaml
      cache-key-prefix:
        description: Prefix for actions/cache keys (use the same value in caller workflows)
        required: false
        type: string
        default: iln
      install-dependencies:
        description: When true, run pnpm install after restoring the store cache
        required: false
        type: boolean
        default: false
      install-args:
        description: Arguments passed to pnpm install (ignored when install-dependencies is false)
        required: false
        type: string
        default: --frozen-lockfile
    outputs:
      cache-hit:
        description: Whether the pnpm store cache was restored on a full key match
        value: ${{ jobs.cache.outputs.cache-hit }}

# Least-privilege: only checkout is needed to warm the pnpm store cache.
permissions:
  contents: read

jobs:
  cache:
    name: pnpm store cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.setup-pnpm.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        id: setup-pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          lockfile-path: ${{ inputs.lockfile-path }}
          cache-key-prefix: ${{ inputs.cache-key-prefix }}
          install-args: ${{ inputs.install-dependencies == true && inputs.install-args || '' }}
