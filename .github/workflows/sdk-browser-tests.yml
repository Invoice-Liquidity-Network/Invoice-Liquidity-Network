name: SDK Browser Tests

on:
  push:
    paths:
      - 'packages/sdk/**'
  pull_request:
    paths:
      - 'packages/sdk/**'

# Least-privilege: read code to build the SDK and run browser compatibility tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: namespace-profile-nursca
    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm

      - name: Build browser bundle
        run: pnpm run build:browser

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser compatibility tests
        run: pnpm run test:browser
