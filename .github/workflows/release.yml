# ==============================================================================
# Release — Issue #247
#
# When changesets are merged into main, this workflow opens a "Version Packages"
# PR that bumps versions and updates changelogs. Merging that PR triggers a
# publish to npm.
# ==============================================================================

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default; the release job elevates to
# contents/pull-requests/id-token as needed.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version Packages or Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for SLSA provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: '9.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm publish credentials
        id: npm-auth
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not configured — skipping Version Packages/Publish. Add the secret (or configure npm trusted publishing) to enable releases."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release PR or Publish
        if: steps.npm-auth.outputs.available == 'true'
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          # Opens a "Version Packages" PR when changesets are present.
          # Publishes to npm when the Version Packages PR is merged.
          publish: pnpm changeset publish
          version: pnpm changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Attest build provenance
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sdk/dist/**
            cli/dist/**
