coverage:
  status:
    project:
      default:
        target: 80%
      # oracle-service gates fund_invoice()'s require_oracle_verification path,
      # so it is held to a higher bar than the rest of the monorepo. The hard
      # gate is in oracle-service/vitest.config.ts; this mirrors it on the
      # Codecov status check.
      oracle-service:
        target: 95%
        flags:
          - oracle-service
        paths:
          - oracle-service/
    patch:
      default:
        target: 70%
      oracle-service:
        target: 95%
        flags:
          - oracle-service
        paths:
          - oracle-service/

flags:
  sdk:
    paths:
      - sdk/
      - packages/sdk/
  indexer:
    paths:
      - indexer/
      - packages/indexer/
  frontend:
    paths:
      - frontend/
  notifications:
    paths:
      - notifications/
  oracle-service:
    paths:
      - oracle-service/
  cli:
    paths:
      - cli/
  shared:
    paths:
      - packages/shared/
  react:
    paths:
      - packages/react/
  mock-backend:
    paths:
      - packages/mock-backend/
  opentelemetry:
    paths:
      - packages/opentelemetry/
  scripts:
    paths:
      - packages/scripts/

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
